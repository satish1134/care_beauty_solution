global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  - job_name: "care_beauty_app"
    metrics_path: "/api/metrics"
    static_configs:
      - targets: ["care_app_prod_blue:3000", "care_app_prod_green:3000"]
        labels:
          environment: "production"
          service: "storefront-api"

  - job_name: "node_exporter"
    static_configs:
      - targets: ["care_node_exporter:9100"]
        labels:
          environment: "production"
          service: "vps-host"

  - job_name: "postgres_exporter"
    static_configs:
      - targets: ["care_postgres_exporter:9187"]
        labels:
          environment: "production"
          service: "postgresql"

  - job_name: "redis_exporter"
    static_configs:
      - targets: ["care_redis_exporter:9121"]
        labels:
          environment: "production"
          service: "redis"
