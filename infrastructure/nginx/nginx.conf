user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Structured JSON access log format for Loki / Promtail ingestion
    log_format json_analytics escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_id":"$http_x_request_id",'
        '"trace_id":"$http_traceparent",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log json_analytics;

    # TCP / Buffer optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Request size limits
    client_max_body_size 16M;
    client_body_buffer_size 128k;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Rate Limiting Zones (Section 86)
    limit_req_zone $binary_remote_addr zone=general_rate_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=15r/s;
    limit_req_zone $binary_remote_addr zone=auth_rate_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=checkout_rate_limit:10m rate=10r/m;

    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
