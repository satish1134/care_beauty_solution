<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scheduled Maintenance - CARE Beauty Solution</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #fcfbf9;
      color: #251b19;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      max-width: 520px;
      background: white;
      padding: 48px;
      border-radius: 24px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
      text-align: center;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #ed5b42;
      background: rgba(237, 91, 66, 0.1);
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 32px;
      line-height: 1.1;
      font-weight: 800;
      margin: 0 0 16px;
      letter-spacing: -0.04em;
    }
    p {
      color: rgba(37, 27, 25, 0.7);
      line-height: 1.6;
      font-size: 15px;
      margin: 0 0 28px;
    }
    .status-box {
      background: #f7f6f3;
      padding: 16px;
      border-radius: 12px;
      font-size: 13px;
      font-family: monospace;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Scheduled Maintenance</div>
    <h1>We are upgrading our systems with care.</h1>
    <p>Our platform is briefly offline while we execute scheduled infrastructure upgrades and database optimizations. We will be right back.</p>
    <div class="status-box">Status: Maintenance in progress &bull; Systems intact</div>
  </div>
</body>
</html>
