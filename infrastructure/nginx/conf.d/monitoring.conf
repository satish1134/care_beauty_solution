# Restricted Monitoring Ingress (Grafana & Prometheus)
server {
    listen 80;
    server_name monitoring.carebeautysolution.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name monitoring.carebeautysolution.com;

    ssl_certificate /etc/letsencrypt/live/monitoring.carebeautysolution.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitoring.carebeautysolution.com/privkey.pem;

    # Restrict to VPN or Authorized Bastion IPs if configured
    # allow 10.0.0.0/8;
    # allow 192.168.1.0/24;
    # deny all;

    # Basic Authentication Gate
    auth_basic "Care Beauty SRE Telemetry";
    auth_basic_user_file /etc/nginx/.htpasswd_monitoring;

    location / {
        proxy_pass http://care_grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
