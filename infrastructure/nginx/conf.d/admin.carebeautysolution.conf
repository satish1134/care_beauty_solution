# ==============================================================================
# Admin CMS Portal: admin.carebeautysolution.com
# Merchant / Inventory / Campaign Management
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name admin.carebeautysolution.com admin.careabeautysolution.com;

    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.carebeautysolution.com admin.careabeautysolution.com;

    # TLS Certificates
    ssl_certificate /etc/letsencrypt/live/admin.careabeautysolution.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.careabeautysolution.com/privkey.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # Security Headers for Administrative Portal
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Environment "Admin-Portal" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Block direct developer SQL studio endpoints on admin portal
    location ^~ /dev/ {
        return 403 "Developer console is restricted to dev.careabeautysolution.com";
    }

    location ^~ /api/dev/ {
        return 403 "Developer endpoints restricted to dev.careabeautysolution.com";
    }

    # Uploads limit for high-resolution photography & PNG assets
    client_max_body_size 32M;

    # Next.js Static Cache
    location /_next/static/ {
        proxy_pass http://app_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Rewrite root of admin domain directly to /admin dashboard
    location = / {
        proxy_pass http://app_cluster/admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy all admin & general app traffic
    location / {
        limit_req zone=general_rate_limit burst=50 nodelay;
        proxy_pass http://app_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $http_x_request_id;
    }
}
