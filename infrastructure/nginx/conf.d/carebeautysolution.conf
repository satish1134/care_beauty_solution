# Dynamic Upstream Slot for Zero-Downtime Blue/Green Deployment
upstream app_cluster {
    # Blue Slot: 127.0.0.1:3001 | Green Slot: 127.0.0.1:3002 (or internal docker container names)
    server care_app_prod_blue:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name carebeautysolution.com www.carebeautysolution.com careabeautysolution.com www.careabeautysolution.com staging.carebeautysolution.com;

    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Production HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name carebeautysolution.com www.carebeautysolution.com careabeautysolution.com www.careabeautysolution.com staging.carebeautysolution.com;

    # TLS Certificates
    ssl_certificate /etc/letsencrypt/live/carebeautysolution.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/carebeautysolution.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Modern TLS Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https:;" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Maintenance Mode Check
    if (-f /usr/share/nginx/html/maintenance/enabled) {
        return 503;
    }
    error_page 503 @maintenance;
    location @maintenance {
        root /usr/share/nginx/html/maintenance;
        rewrite ^(.*)$ /maintenance.html break;
    }

    # Static Assets & Next.js Static Files Cache
    location /_next/static/ {
        proxy_pass http://app_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public Health Endpoint (Bypasses Rate Limiting for Uptime Monitors)
    location = /api/health {
        proxy_pass http://app_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Protected Readiness Endpoint
    location = /api/readiness {
        proxy_pass http://app_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Sensitive Routes Rate Limiting (Authentication, Passwords)
    location ~* ^/api/auth/(login|register|reset-password) {
        limit_req zone=auth_rate_limit burst=3 nodelay;
        proxy_pass http://app_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Block /dev/ routes completely on production domain (never expose to public)
    location ^~ /dev/ {
        return 404;
    }

    # Redirect /admin to merchant admin CMS subdomain
    location = /admin {
        return 301 https://admin.carebeautysolution.com;
    }

    # Checkout & Payment Rate Limiting
    location ~* ^/api/checkout {
        limit_req zone=checkout_rate_limit burst=5 nodelay;
        proxy_pass http://app_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # General API Traffic
    location /api/ {
        limit_req zone=api_rate_limit burst=20 nodelay;
        proxy_pass http://app_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $http_x_request_id;
    }

    # General Web Application Traffic
    location / {
        limit_req zone=general_rate_limit burst=50 nodelay;
        proxy_pass http://app_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $http_x_request_id;
    }
}
