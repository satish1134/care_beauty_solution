name: care-beauty-local

services:
  app:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    container_name: care_beauty_app_local
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://care_user:care_secure_password@postgres:5432/care_beauty_db?sslmode=disable
      - REDIS_URL=redis://:care_redis_auth_token@redis:6379/0
      - REDIS_PASSWORD=care_redis_auth_token
      - JWT_SECRET=local_jwt_super_secret_key_32_characters_long_min
      - SESSION_SECRET=local_session_super_secret_key_32_characters
      - S3_ENDPOINT=minio:9000
      - S3_BUCKET=care-beauty-assets
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - care-public
      - care-backend

  postgres:
    image: postgres:16-alpine
    container_name: care_postgres_local
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: care_user
      POSTGRES_PASSWORD: care_secure_password
      POSTGRES_DB: care_beauty_db
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U care_user -d care_beauty_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - care-backend

  redis:
    image: redis:7-alpine
    container_name: care_redis_local
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "care_redis_auth_token", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_local_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "care_redis_auth_token", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - care-backend

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: care_minio_local
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_local_data:/data
    networks:
      - care-backend

  mailpit:
    image: axllent/mailpit:latest
    container_name: care_mailpit_local
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - care-backend

networks:
  care-public:
    driver: bridge
  care-backend:
    driver: bridge

volumes:
  postgres_local_data:
  redis_local_data:
  minio_local_data:
