name: care-beauty-prod

services:
  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: care_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /opt/care-beauty/prod/maintenance:/usr/share/nginx/html/maintenance:ro
    networks:
      - care-public
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # Active Slot A (Blue)
  app_blue:
    image: ${IMAGE_NAME:-ghcr.io/satish1134/care-a-beauty-solution}:${APP_VERSION_TAG_BLUE:-main}
    container_name: care_app_prod_blue
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - APP_VERSION=${APP_VERSION}
      - GIT_COMMIT_SHA=${GIT_COMMIT_SHA_BLUE}
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - SENTRY_ENVIRONMENT=production
      - PROMETHEUS_METRICS_ENABLED=true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - care-public
      - care-backend
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  # Standby Slot B (Green) - Activated dynamically during zero-downtime cutover
  app_green:
    image: ${IMAGE_NAME:-ghcr.io/satish1134/care-a-beauty-solution}:${APP_VERSION_TAG_GREEN:-main}
    container_name: care_app_prod_green
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - APP_VERSION=${APP_VERSION}
      - GIT_COMMIT_SHA=${GIT_COMMIT_SHA_GREEN}
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - SENTRY_ENVIRONMENT=production
      - PROMETHEUS_METRICS_ENABLED=true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - care-public
      - care-backend
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  worker:
    image: ${IMAGE_NAME:-ghcr.io/satish1134/care-a-beauty-solution}:${APP_VERSION_TAG_BLUE:-main}
    container_name: care_worker_prod
    restart: always
    command: ["node", "dist/worker.js"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SENTRY_ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - care-backend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  postgres:
    image: postgres:16-alpine
    container_name: care_postgres_prod
    restart: always
    # Private network only: Zero public host ports exposed
    environment:
      POSTGRES_USER: ${DB_USER:-care_prod_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-care_beauty_prod}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - /opt/care-beauty/prod/data/postgres:/var/lib/postgresql/data
      - /opt/care-beauty/prod/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-care_prod_user} -d ${DB_NAME:-care_beauty_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - care-backend
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3072M

  redis:
    image: redis:7-alpine
    container_name: care_redis_prod
    restart: always
    # Private network only: Zero public host ports exposed
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "1024mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes", "--save", "900", "1", "300", "10"]
    volumes:
      - /opt/care-beauty/prod/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - care-backend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

networks:
  care-public:
    driver: bridge
  care-backend:
    driver: bridge
    internal: true
