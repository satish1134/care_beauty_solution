name: care-beauty-dev

services:
  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: care_nginx_dev
    restart: unless-stopped
    profiles:
      - proxy
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d/dev.carebeautysolution.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /opt/care-beauty/dev/maintenance:/usr/share/nginx/html/maintenance:ro
    depends_on:
      - app
    networks:
      - care-public
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  app:
    image: ${IMAGE_NAME:-ghcr.io/satish1134/care-a-beauty-solution}:${GIT_COMMIT_SHA:-develop}
    container_name: care_app_dev
    restart: unless-stopped
    ports:
      - "0.0.0.0:3002:3000"
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - APP_VERSION=1.0.0
      - GIT_COMMIT_SHA=${GIT_COMMIT_SHA:-develop}
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - SENTRY_ENVIRONMENT=development
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - care-public
      - care-backend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  postgres:
    image: postgres:16-alpine
    container_name: care_postgres_dev
    restart: unless-stopped
    # Private network only: no host ports published!
    environment:
      POSTGRES_USER: ${DB_USER:-care_dev_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-care_beauty_dev}
    volumes:
      - /opt/care-beauty/dev/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-care_dev_user} -d ${DB_NAME:-care_beauty_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - care-backend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  redis:
    image: redis:7-alpine
    container_name: care_redis_dev
    restart: unless-stopped
    # Private network only: no host ports published!
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "384mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes"]
    volumes:
      - /opt/care-beauty/dev/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - care-backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

networks:
  care-public:
    driver: bridge
  care-backend:
    driver: bridge
    internal: true
