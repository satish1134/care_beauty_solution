name: Ops - SSL Certificate Manager

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'SSL Action to perform'
        required: true
        type: choice
        options:
          - status
          - issue-admin
          - issue-unified
          - reload
        default: 'status'
      contact_email:
        description: 'Admin contact email for Let Encrypt'
        required: false
        default: 'info@careabeautysolution.com'

jobs:
  manage-ssl:
    name: Execute SSL Operation on VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy SSL management script to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.PROD_VPS_HOST || secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT || 22 }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "infrastructure/scripts/ssl-manager.sh,infrastructure/nginx/conf.d/**"
          target: "/opt/care-beauty"
          strip_components: 1

      - name: Execute SSL Manager
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_VPS_HOST || secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT || 22 }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            chmod +x /opt/care-beauty/scripts/ssl-manager.sh
            /opt/care-beauty/scripts/ssl-manager.sh "${{ github.event.inputs.action }}" "${{ github.event.inputs.contact_email }}"
