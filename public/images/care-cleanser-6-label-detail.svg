<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMacro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="goldMacro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#F3E5AB" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <filter id="macroShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#000" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bgMacro)" />

  <!-- Zoomed Macro Label Surface Background -->
  <rect x="100" y="50" width="600" height="700" rx="30" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#macroShadow)" />

  <!-- Macro Label Artwork -->
  <g transform="translate(400, 260)">
    <!-- Gold Emblem -->
    <circle cx="0" cy="0" r="80" fill="none" stroke="url(#goldMacro)" stroke-width="4" />
    <circle cx="0" cy="0" r="92" fill="none" stroke="url(#goldMacro)" stroke-width="2" stroke-dasharray="8 6" />
    <circle cx="0" cy="0" r="68" fill="none" stroke="url(#goldMacro)" stroke-width="1" />
    <line x1="0" y1="-30" x2="0" y2="30" stroke="url(#goldMacro)" stroke-width="3" />
    <text x="18" y="14" font-family="'Playfair Display', serif" font-size="44" font-weight="bold" fill="url(#goldMacro)">C</text>

    <!-- CARe Brand Header -->
    <text x="0" y="150" text-anchor="middle" font-family="'Playfair Display', serif" font-size="64" font-weight="bold" letter-spacing="6" fill="url(#goldMacro)">CARe</text>
    <text x="0" y="190" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" letter-spacing="8" fill="#92400E">A BEAUTY SOLUTION</text>

    <!-- Divider Line -->
    <line x1="-200" y1="220" x2="200" y2="220" stroke="url(#goldMacro)" stroke-width="2" />

    <!-- REFRESHING SKIN CLEANSER -->
    <text x="0" y="270" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="38" font-weight="800" letter-spacing="3" fill="#0F766E">REFRESHING</text>
    <text x="0" y="320" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="40" font-weight="800" letter-spacing="3" fill="#0F766E">SKIN CLEANSER</text>
    <text x="0" y="360" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="700" fill="#334155">For Face &amp; Body</text>

    <!-- Active Ingredients Pill -->
    <rect x="-240" y="390" width="480" height="50" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="2" />
    <text x="0" y="424" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#0F766E">With Niacinamide &amp; Panthenol</text>
  </g>
</svg>
