<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="100%" height="100%">
  <defs>
    <!-- Background marble lighting -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF9F6"/>
      <stop offset="50%" stop-color="#F3EFE9"/>
      <stop offset="100%" stop-color="#EAE3D7"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#F8F4EC" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#EAE3D7" stop-opacity="0"/>
    </radialGradient>
    <!-- Bottle 3D Lighting -->
    <linearGradient id="bottleShade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5E2DC"/>
      <stop offset="8%" stop-color="#F7F6F4"/>
      <stop offset="25%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FCFCFA"/>
      <stop offset="92%" stop-color="#ECE8E1"/>
      <stop offset="100%" stop-color="#DAD4C9"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F3E5AB"/>
      <stop offset="100%" stop-color="#AA820A"/>
    </linearGradient>
    <linearGradient id="tealPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A2C8BD"/>
      <stop offset="50%" stop-color="#B7D7CE"/>
      <stop offset="100%" stop-color="#91BDB1"/>
    </linearGradient>
    <!-- Soft shadow filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#362919" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="1200" fill="url(#bgGrad)"/>
  <rect width="800" height="1200" fill="url(#sunGlow)"/>

  <!-- Subtle Palm Shadow Texture in Background -->
  <path d="M 0 150 Q 250 300 450 180 T 800 240 L 800 0 L 0 0 Z" fill="#2E4035" opacity="0.04"/>
  <path d="M 800 350 Q 550 500 350 420 T 0 580 L 0 300 L 800 200 Z" fill="#2E4035" opacity="0.03"/>

  <!-- Bottle Grounding Shadow -->
  <ellipse cx="400" cy="1070" rx="210" ry="24" fill="#2A241E" opacity="0.18"/>
  <ellipse cx="400" cy="1068" rx="140" ry="12" fill="#1C1814" opacity="0.22"/>

  <!-- BOTTLE GROUP WITH SHADOW -->
  <g filter="url(#dropShadow)">
    <!-- Pump Dispenser Assembly -->
    <!-- Neck / Collar -->
    <rect x="360" y="270" width="80" height="65" rx="5" fill="#FAF9F7" stroke="#E2DCD2" stroke-width="2"/>
    <line x1="360" y1="295" x2="440" y2="295" stroke="#DDD7CC" stroke-width="2"/>
    <line x1="360" y1="315" x2="440" y2="315" stroke="#DDD7CC" stroke-width="2"/>

    <!-- Pump Stem -->
    <rect x="382" y="200" width="36" height="75" fill="#FAF9F7" stroke="#E2DCD2" stroke-width="2"/>

    <!-- Pump Head / Nozzle -->
    <path d="M 230 115 
             C 250 95, 360 85, 430 100 
             C 455 106, 465 125, 465 160 
             C 465 180, 445 195, 418 195 
             C 390 195, 385 175, 375 165
             C 360 150, 310 148, 230 135
             C 220 132, 220 120, 230 115 Z"
          fill="#FFFFFF" stroke="#DDD7CC" stroke-width="2"/>
    <!-- Pump Nozzle Orifice -->
    <ellipse cx="230" cy="125" rx="5" ry="9" fill="#E8E4DC"/>

    <!-- Main Bottle Body (Ergonomic 120ml bottle) -->
    <path d="M 270 340
             C 320 330, 480 330, 530 340
             C 575 350, 600 410, 605 480
             C 615 620, 615 850, 600 970
             C 590 1030, 540 1055, 400 1055
             C 260 1055, 210 1030, 200 970
             C 185 850, 185 620, 195 480
             C 200 410, 225 350, 270 340 Z"
          fill="url(#bottleShade)" stroke="#D8D2C5" stroke-width="2"/>

    <!-- Subdued Left Rim Highlight -->
    <path d="M 215 480 C 205 620, 205 850, 218 960" stroke="#FFFFFF" stroke-width="6" opacity="0.6" stroke-linecap="round"/>
  </g>

  <!-- BOTTLE LABEL GRAPHICS & TYPOGRAPHY -->
  <g id="labelContent">
    <!-- Brand Mandala Logo -->
    <g transform="translate(400, 440)">
      <!-- Outer gold ring -->
      <circle cx="0" cy="0" r="52" fill="none" stroke="url(#goldAccent)" stroke-width="2.5"/>
      <!-- Decorative petal ring -->
      <circle cx="0" cy="0" r="46" fill="none" stroke="#C29B27" stroke-width="1" stroke-dasharray="3 3"/>
      <!-- Inner ring -->
      <circle cx="0" cy="0" r="38" fill="none" stroke="url(#goldAccent)" stroke-width="1.5"/>
      <!-- Botanical leaf left -->
      <path d="M -15 4 C -22 -8, -12 -16, -10 -8 C -8 -2, -12 2, -15 4 Z" fill="none" stroke="#A17C18" stroke-width="1.8"/>
      <!-- Center divider -->
      <line x1="0" y1="-22" x2="0" y2="22" stroke="#A17C18" stroke-width="1.5"/>
      <!-- Letter C right -->
      <text x="14" y="6" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="600" fill="#8C6A0D" text-anchor="middle">C</text>
    </g>

    <!-- Brand Name -->
    <text x="400" y="525" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="30" font-weight="700" letter-spacing="4" fill="#3D3831" text-anchor="middle">
      CARe
    </text>
    <line x1="330" y1="538" x2="470" y2="538" stroke="#D4AF37" stroke-width="1"/>
    <text x="400" y="552" font-family="'Montserrat', sans-serif" font-size="11" font-weight="600" letter-spacing="3" fill="#6B6357" text-anchor="middle">
      A BEAUTY SOLUTION
    </text>

    <!-- Product Title -->
    <text x="400" y="605" font-family="'Montserrat', 'Helvetica Neue', sans-serif" font-size="24" font-weight="800" letter-spacing="1.5" fill="#235347" text-anchor="middle">
      REFRESHING
    </text>
    <text x="400" y="633" font-family="'Montserrat', 'Helvetica Neue', sans-serif" font-size="24" font-weight="800" letter-spacing="1.5" fill="#235347" text-anchor="middle">
      SKIN CLEANSER
    </text>

    <!-- Subtitle -->
    <text x="400" y="662" font-family="'Playfair Display', Georgia, serif" font-style="italic" font-size="16" fill="#4A5568" text-anchor="middle">
      For Face &amp; Body
    </text>

    <!-- Badges line -->
    <text x="400" y="692" font-family="'Montserrat', sans-serif" font-size="11" font-weight="500" letter-spacing="0.5" fill="#5A6578" text-anchor="middle">
      Soap-Free  |  pH Balanced  |  Barrier-Friendly
    </text>

    <!-- Key Active Pill -->
    <g transform="translate(400, 725)">
      <rect x="-160" y="-16" width="320" height="32" rx="6" fill="url(#tealPill)"/>
      <text x="0" y="5" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" letter-spacing="0.8" fill="#143D34" text-anchor="middle">
        With Niacinamide &amp; Panthenol
      </text>
    </g>

    <!-- Claims -->
    <text x="400" y="780" font-family="'Montserrat', sans-serif" font-size="12" font-weight="600" letter-spacing="0.5" fill="#4B5563" text-anchor="middle">
      Fragrance-Free  •  Non-Comedogenic
    </text>

    <line x1="280" y1="805" x2="520" y2="805" stroke="#CBD5E1" stroke-width="1"/>
    <text x="400" y="828" font-family="'Playfair Display', Georgia, serif" font-style="italic" font-size="15" fill="#334155" text-anchor="middle">
      Gently Cleanses Without Drying
    </text>
    <line x1="280" y1="845" x2="520" y2="845" stroke="#CBD5E1" stroke-width="1"/>

    <!-- Suitability & Volume -->
    <text x="400" y="875" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" letter-spacing="0.5" fill="#475569" text-anchor="middle">
      For All Skin Types
    </text>
    <text x="400" y="905" font-family="'Montserrat', sans-serif" font-size="16" font-weight="700" letter-spacing="1" fill="#1E293B" text-anchor="middle">
      120 ml
    </text>

    <!-- 4 Circular Badges -->
    <g transform="translate(400, 960)">
      <!-- 1. Soap Free -->
      <g transform="translate(-110, 0)">
        <circle cx="0" cy="0" r="18" fill="none" stroke="#64748B" stroke-width="1.2"/>
        <path d="M 0 -8 C 6 -2, 6 6, 0 8 C -6 6, -6 -2, 0 -8 Z" fill="none" stroke="#475569" stroke-width="1.4"/>
        <text x="0" y="28" font-family="'Montserrat', sans-serif" font-size="7.5" font-weight="700" fill="#64748B" text-anchor="middle">SOAP FREE</text>
      </g>
      <!-- 2. pH Balanced -->
      <g transform="translate(-36, 0)">
        <circle cx="0" cy="0" r="18" fill="none" stroke="#64748B" stroke-width="1.2"/>
        <path d="M 0 -8 C 5 0, 5 6, 0 8 C -5 6, -5 0, 0 -8 Z" fill="none" stroke="#475569" stroke-width="1.4"/>
        <text x="0" y="28" font-family="'Montserrat', sans-serif" font-size="7.5" font-weight="700" fill="#64748B" text-anchor="middle">pH BALANCED</text>
      </g>
      <!-- 3. Barrier Friendly -->
      <g transform="translate(36, 0)">
        <circle cx="0" cy="0" r="18" fill="none" stroke="#64748B" stroke-width="1.2"/>
        <path d="M -6 -6 L 6 -6 L 6 0 C 6 5, 0 8, 0 8 C 0 8, -6 5, -6 0 Z" fill="none" stroke="#475569" stroke-width="1.4"/>
        <text x="0" y="28" font-family="'Montserrat', sans-serif" font-size="7.5" font-weight="700" fill="#64748B" text-anchor="middle">BARRIER</text>
      </g>
      <!-- 4. Non-Comedogenic -->
      <g transform="translate(110, 0)">
        <circle cx="0" cy="0" r="18" fill="none" stroke="#64748B" stroke-width="1.2"/>
        <path d="M 0 -2 C -2 -7, -7 -5, -7 0 C -7 5, 0 8, 0 8 C 0 8, 7 5, 7 0 C 7 -5, 2 -7, 0 -2 Z" fill="none" stroke="#475569" stroke-width="1.4"/>
        <text x="0" y="28" font-family="'Montserrat', sans-serif" font-size="7.5" font-weight="700" fill="#64748B" text-anchor="middle">NON-COMEDO</text>
      </g>
    </g>
  </g>
</svg>
