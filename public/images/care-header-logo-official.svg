        <ellipse cx="400" cy="310" rx="175" ry="58" transform="rotate(288.00 400 310)" fill="none" stroke="url(#hlGoldWire)" stroke-width="5.0" />
        <ellipse cx="400" cy="310" rx="175" ry="58" transform="rotate(306.00 400 310)" fill="none" stroke="url(#hlGoldWire)" stroke-width="5.0" />
        <ellipse cx="400" cy="310" rx="175" ry="58" transform="rotate(324.00 400 310)" fill="none" stroke="url(#hlGoldWire)" stroke-width="5.0" />
        <ellipse cx="400" cy="310" rx="175" ry="58" transform="rotate(342.00 400 310)" fill="none" stroke="url(#hlGoldWire)" stroke-width="5.0" />
        <ellipse cx="399" cy="309" rx="175" ry="58" transform="rotate(0.00 400 310)" fill="none" stroke="url(#hlGoldSpec)" stroke-width="1.6" opacity="0.9" />
        <ellipse cx="399" cy="309" rx="175" ry="58" transform="rotate(36.00 400 310)" fill="none" stroke="url(#hlGoldSpec)" stroke-width="1.6" opacity="0.9" />
        <ellipse cx="399" cy="309" rx="175" ry="58" transform="rotate(72.00 400 310)" fill="none" stroke="url(#hlGoldSpec)" stroke-width="1.6" opacity="0.9" />
        <ellipse cx="399" cy="309" rx="175" ry="58" transform="rotate(108.00 400 310)" fill="none" stroke="url(#hlGoldSpec)" stroke-width="1.6" opacity="0.9" />
        <ellipse cx="399" cy="309" rx="175" ry="58" transform="rotate(144.00 400 310)" fill="none" stroke="url(#hlGoldSpec)" stroke-width="1.6" opacity="0.9" />
        <ellipse cx="399" cy="309" rx="175" ry="58" transform="rotate(180.00 400 310)" fill="none" stroke="url(#hlGoldSpec)" stroke-width="1.6" opacity="0.9" />
        <ellipse cx="399" cy="309" rx="175" ry="58" transform="rotate(216.00 400 310)" fill="none" stroke="url(#hlGoldSpec)" stroke-width="1.6" opacity="0.9" />
        <ellipse cx="399" cy="309" rx="175" ry="58" transform="rotate(252.00 400 310)" fill="none" stroke="url(#hlGoldSpec)" stroke-width="1.6" opacity="0.9" />
        <ellipse cx="399" cy="309" rx="175" ry="58" transform="rotate(288.00 400 310)" fill="none" stroke="url(#hlGoldSpec)" stroke-width="1.6" opacity="0.9" />
        <ellipse cx="399" cy="309" rx="175" ry="58" transform="rotate(324.00 400 310)" fill="none" stroke="url(#hlGoldSpec)" stroke-width="1.6" opacity="0.9" />
