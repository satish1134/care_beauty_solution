<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 160" width="100%" height="100%">
  <defs>
    <linearGradient id="hlGold3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#663F05" />
      <stop offset="12%" stop-color="#9C7215" />
      <stop offset="26%" stop-color="#DBB030" />
      <stop offset="42%" stop-color="#FFF9DE" />
      <stop offset="56%" stop-color="#ECC664" />
      <stop offset="72%" stop-color="#A57A18" />
      <stop offset="88%" stop-color="#FAE89E" />
      <stop offset="100%" stop-color="#522F02" />
    </linearGradient>

    <linearGradient id="hlGoldWire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#734907" />
      <stop offset="25%" stop-color="#D8AF33" />
      <stop offset="50%" stop-color="#FFF6D0" />
      <stop offset="75%" stop-color="#9E7317" />
      <stop offset="100%" stop-color="#5B3402" />
    </linearGradient>

    <linearGradient id="hlGoldSpec" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A1E00" stop-opacity="0.1" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#EAC45F" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.95" />
    </linearGradient>

    <filter id="hlBevel" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="1.8" dy="3.2" stdDeviation="2.4" flood-color="#241300" flood-opacity="0.36" />
      <feDropShadow dx="-0.8" dy="-0.8" stdDeviation="1.0" flood-color="#FFFDEE" flood-opacity="0.88" />
    </filter>
  </defs>

  <g id="header-logo-group" filter="url(#hlBevel)">
    <!-- LEFT: EMBLEM (Center X=80, Y=80, Radius ~68) -->
    <g transform="translate(80, 80)">
      <!-- Guilloche Wreath -->
      <g transform="scale(0.42) translate(-400, -310)">
        <ellipse cx="400" cy="310" rx="175" ry="58" transform="rotate(0.00 400 310)" fill="none" stroke="url(#hlGoldWire)" stroke-width="5.0" />
        <ellipse cx="400" cy="310" rx="175" ry="58" transform="rotate(18.00 400 310)" fill="none" stroke="url(#hlGoldWire)" stroke-width="5.0" />
        <ellipse cx="400" cy="310" rx="175" ry="58" transform="rotate(36.00 400 310)" fill="none" stroke="url(#hlGoldWire)" stroke-width="5.0" />
        <ellipse cx="400" cy="310" rx="175" ry="58" transform="rotate(54.00 400 310)" fill="none" stroke="url(#hlGoldWire)" stroke-width="5.0" />
        <ellipse cx="400" cy="310" rx="175" ry="58" transform="rotate(72.00 400 310)" fill="none" stroke="url(#hlGoldWire)" stroke-width="5.0" />
        <ellipse cx="400" cy="310" rx="175" ry="58" transform="rotate(90.00 400 310)" fill="none" stroke="url(#hlGoldWire)" stroke-width="5.0" />
        <ellipse cx="400" cy="310" rx="175" ry="58" transform="rotate(108.00 400 310)" fill="none" stroke="url(#hlGoldWire)" stroke-width="5.0" />
        <ellipse cx="400" cy="310" rx="175" ry="58" transform="rotate(126.00 400 310)" fill="none" stroke="url(#hlGoldWire)" stroke-width="5.0" />
        <ellipse cx="400" cy="310" rx="175" ry="58" transform="rotate(144.00 400 310)" fill="none" stroke="url(#hlGoldWire)" stroke-width="5.0" />
        <ellipse cx="400" cy="310" rx="175" ry="58" transform="rotate(162.00 400 310)" fill="none" stroke="url(#hlGoldWire)" stroke-width="5.0" />
        <ellipse cx="400" cy="310" rx="175" ry="58" transform="rotate(180.00 400 310)" fill="none" stroke="url(#hlGoldWire)" stroke-width="5.0" />
        <ellipse cx="400" cy="310" rx="175" ry="58" transform="rotate(198.00 400 310)" fill="none" stroke="url(#hlGoldWire)" stroke-width="5.0" />
        <ellipse cx="400" cy="310" rx="175" ry="58" transform="rotate(216.00 400 310)" fill="none" stroke="url(#hlGoldWire)" stroke-width="5.0" />
        <ellipse cx="400" cy="310" rx="175" ry="58" transform="rotate(234.00 400 310)" fill="none" stroke="url(#hlGoldWire)" stroke-width="5.0" />
