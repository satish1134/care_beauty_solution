        <circle cx="31" cy="-30" r="5.5" fill="url(#hlGold3D)" stroke="url(#hlGoldSpec)" stroke-width="1" />
        <path d="M 23 26 L 36 33 L 24 38 Z" fill="url(#hlGold3D)" />
      </g>
