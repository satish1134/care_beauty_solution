    <!-- RIGHT: CARe BRAND NAME -->
    <g transform="translate(182, 102)">
      <!-- Roman Font Letters -->
      <text font-family="'Cinzel', 'Playfair Display', 'Times New Roman', Georgia, serif" 
            font-size="80" 
            font-weight="700" 
            letter-spacing="5" 
            fill="url(#hlGold3D)" 
            stroke="url(#hlGoldSpec)" 
            stroke-width="1.2">
        <tspan x="0">C</tspan>
        <tspan dx="4">A</tspan>
        <tspan dx="4">R</tspan>
        <tspan dx="4" font-size="70" dy="-1">e</tspan>
      </text>
    </g>
