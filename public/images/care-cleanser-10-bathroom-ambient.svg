<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAmbient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="50%" stop-color="#F3EFEA" />
      <stop offset="100%" stop-color="#E2D9CC" />
    </linearGradient>
    <linearGradient id="goldAmb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <filter id="ambShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#1E293B" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bgAmbient)" />

  <!-- Soft Sunlight Shadows on Marble Wall -->
  <path d="M 0 0 L 800 0 L 800 800 L 0 800 Z" fill="#FAF8F5" />
  <path d="M 100 0 L 250 800 L 350 800 L 200 0 Z" fill="#000000" opacity="0.03" />
  <path d="M 400 0 L 550 800 L 650 800 L 500 0 Z" fill="#000000" opacity="0.03" />

  <!-- Countertop -->
  <path d="M 0 560 L 800 560 L 800 800 L 0 800 Z" fill="#FFFFFF" opacity="0.7" />

  <!-- Botanical Plant Pot Right -->
  <circle cx="720" cy="520" r="60" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2" />
  <path d="M 680 460 C 620 400 600 300 680 200 C 720 300 740 400 680 460 Z" fill="#15803D" opacity="0.9" />
  <path d="M 720 480 C 700 380 740 280 800 220 C 800 340 760 440 720 480 Z" fill="#166534" opacity="0.85" />

  <!-- Main Product Bottle -->
  <g transform="translate(0, 0)" filter="url(#ambShadow)">
    <path d="M 310 270 C 350 250, 450 250, 490 270 C 525 310, 535 430, 530 600 C 525 660, 480 680, 400 680 C 320 680, 275 660, 270 600 C 265 430, 275 310, 310 270 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    
    <!-- Pump -->
    <rect x="360" y="235" width="80" height="20" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
    <path d="M 400 210 L 400 160 C 400 145, 370 135, 320 145 C 305 148, 300 158, 305 168 C 310 175, 325 175, 340 170 L 400 175 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />

    <!-- Label Artwork -->
    <g transform="translate(400, 330)">
      <circle cx="0" cy="0" r="28" fill="none" stroke="url(#goldAmb)" stroke-width="2" />
      <text x="0" y="4" text-anchor="middle" font-family="'Playfair Display', serif" font-size="16" font-weight="bold" fill="url(#goldAmb)">C</text>
      <text x="0" y="52" text-anchor="middle" font-family="'Playfair Display', serif" font-size="24" font-weight="bold" letter-spacing="2" fill="url(#goldAmb)">CARe</text>
      <text x="0" y="66" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" letter-spacing="3" fill="#92400E">A BEAUTY SOLUTION</text>
      <text x="0" y="96" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#0F766E">REFRESHING</text>
      <text x="0" y="116" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#0F766E">SKIN CLEANSER</text>
      <rect x="-90" y="150" width="180" height="20" rx="4" fill="#CCFBF1" stroke="#0D9488" stroke-width="0.8" />
      <text x="0" y="164" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="800" fill="#0F766E">With Niacinamide &amp; Panthenol</text>
    </g>
  </g>
</svg>
