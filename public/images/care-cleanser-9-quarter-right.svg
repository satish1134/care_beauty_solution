<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAngle2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="goldAngle2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <filter id="angleShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="15" dy="25" stdDeviation="18" flood-color="#000" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bgAngle2)" />

  <path d="M 0 540 L 800 540 L 800 800 L 0 800 Z" fill="#FFFFFF" opacity="0.5" />

  <!-- 3/4 Quarter Angle Bottle Right Facing -->
  <g transform="translate(-10, 0)" filter="url(#angleShadow2)">
    <path d="M 310 280 C 340 250, 430 250, 470 270 C 505 310, 515 430, 520 590 C 525 650, 490 680, 420 680 C 340 680, 300 660, 290 600 C 280 440, 285 320, 310 280 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />

    <!-- Side Shadow Right side -->
    <path d="M 290 600 C 280 440, 285 320, 310 280 C 340 250, 400 250, 400 680 C 340 680, 300 660, 290 600 Z" fill="#E2E8F0" opacity="0.3" />

    <!-- Pump Spout angled right -->
    <path d="M 410 210 L 410 160 C 410 145, 460 135, 510 145 C 525 148, 530 158, 525 168 C 520 175, 505 175, 490 170 L 410 175 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />

    <g transform="translate(420, 330) skewY(-2)">
      <circle cx="0" cy="0" r="28" fill="none" stroke="url(#goldAngle2)" stroke-width="2" />
      <text x="0" y="4" text-anchor="middle" font-family="'Playfair Display', serif" font-size="16" font-weight="bold" fill="url(#goldAngle2)">C</text>
      <text x="0" y="52" text-anchor="middle" font-family="'Playfair Display', serif" font-size="24" font-weight="bold" letter-spacing="2" fill="url(#goldAngle2)">CARe</text>
      <text x="0" y="96" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#0F766E">REFRESHING</text>
      <text x="0" y="116" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#0F766E">SKIN CLEANSER</text>
      <rect x="-90" y="150" width="180" height="20" rx="4" fill="#CCFBF1" stroke="#0D9488" stroke-width="0.8" />
      <text x="0" y="164" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="800" fill="#0F766E">With Niacinamide &amp; Panthenol</text>
    </g>
  </g>
</svg>
