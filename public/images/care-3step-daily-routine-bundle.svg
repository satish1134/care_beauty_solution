<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF9F6"/>
      <stop offset="100%" stop-color="#EFECE6"/>
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7A7A"/>
      <stop offset="100%" stop-color="#E85D5D"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C378"/>
      <stop offset="100%" stop-color="#C29B38"/>
    </linearGradient>
    <linearGradient id="whiteBottle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F4F4F4"/>
      <stop offset="100%" stop-color="#E6E6E6"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="600" fill="url(#bgGrad)"/>

  <!-- Podium / Pedestal Base -->
  <ellipse cx="300" cy="510" rx="240" ry="40" fill="#E2DDD5" opacity="0.7"/>
  <ellipse cx="300" cy="500" rx="220" ry="30" fill="#EBE7DF"/>

  <!-- BUNDLE BADGE -->
  <g transform="translate(420, 70)">
    <rect width="140" height="34" rx="17" fill="url(#coralGrad)" filter="url(#softShadow)"/>
    <text x="70" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">3-STEP TRIO</text>
  </g>

  <!-- 1. LEFT BOTTLE: REFRESHING CLEANSER -->
  <g transform="translate(110, 200)" filter="url(#softShadow)">
    <!-- Pump -->
    <rect x="52" y="0" width="16" height="35" rx="3" fill="#D8D8D8"/>
    <rect x="35" y="10" width="45" height="12" rx="4" fill="#E85D5D"/>
    <!-- Cap -->
    <rect x="42" y="35" width="36" height="20" rx="4" fill="#333333"/>
    <!-- Bottle -->
    <rect x="25" y="55" width="70" height="230" rx="16" fill="url(#whiteBottle)"/>
    <!-- Label -->
    <rect x="27" y="100" width="66" height="130" fill="#FFFFFF" opacity="0.95"/>
    <text x="60" y="125" font-family="system-ui, sans-serif" font-size="8" font-weight="900" fill="#E85D5D" text-anchor="middle" letter-spacing="1">CARE</text>
    <text x="60" y="145" font-family="system-ui, sans-serif" font-size="7" font-weight="700" fill="#1A1A1A" text-anchor="middle">CLEANSER</text>
    <text x="60" y="160" font-family="system-ui, sans-serif" font-size="6" font-weight="600" fill="#2D5A3D" text-anchor="middle">pH 5.5 GENTLE</text>
    <text x="60" y="180" font-family="system-ui, sans-serif" font-size="6" font-weight="500" fill="#777777" text-anchor="middle">Colloidal Oat</text>
    <rect x="45" y="200" width="30" height="12" rx="6" fill="#FAF0F0"/>
    <text x="60" y="209" font-family="system-ui, sans-serif" font-size="6" font-weight="800" fill="#E85D5D" text-anchor="middle">STEP 1</text>
  </g>

  <!-- 2. CENTER JAR: CERAMIDE MOISTURIZER -->
  <g transform="translate(230, 240)" filter="url(#softShadow)">
    <!-- Lid -->
    <rect x="15" y="0" width="110" height="30" rx="8" fill="url(#goldGrad)"/>
    <!-- Jar Body -->
    <rect x="10" y="30" width="120" height="190" rx="18" fill="url(#whiteBottle)"/>
    <!-- Label -->
    <rect x="15" y="65" width="110" height="110" fill="#FFFFFF" opacity="0.95"/>
    <text x="70" y="90" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#E85D5D" text-anchor="middle" letter-spacing="1.5">CARE BEAUTY</text>
    <text x="70" y="110" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#1A1A1A" text-anchor="middle">CERAMIDE MOISTURIZER</text>
    <text x="70" y="125" font-family="system-ui, sans-serif" font-size="7" font-weight="600" fill="#2D5A3D" text-anchor="middle">3x Ceramides + Niacinamide</text>
    <text x="70" y="140" font-family="system-ui, sans-serif" font-size="6" font-weight="500" fill="#777777" text-anchor="middle">72H Deep Barrier Hydration</text>
    <rect x="52" y="152" width="36" height="14" rx="7" fill="#FAF0F0"/>
    <text x="70" y="162" font-family="system-ui, sans-serif" font-size="7" font-weight="800" fill="#E85D5D" text-anchor="middle">STEP 2</text>
  </g>

  <!-- 3. RIGHT TUBE: RAY BARRIER SUNSCREEN -->
  <g transform="translate(375, 210)" filter="url(#softShadow)">
    <!-- Tube Body -->
    <path d="M 20 20 L 75 20 L 70 210 L 25 210 Z" fill="url(#whiteBottle)"/>
    <!-- Cap (Base) -->
    <rect x="25" y="210" width="45" height="35" rx="6" fill="#1A1A1A"/>
    <!-- Label Details -->
    <text x="47" y="65" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#E85D5D" text-anchor="middle" letter-spacing="1">CARE</text>
    <text x="47" y="85" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#1A1A1A" text-anchor="middle">RAY BARRIER</text>
    <text x="47" y="105" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#E85D5D" text-anchor="middle">SPF 50+</text>
    <text x="47" y="120" font-family="system-ui, sans-serif" font-size="7" font-weight="700" fill="#2D5A3D" text-anchor="middle">PA++++ SHIELD</text>
    <text x="47" y="140" font-family="system-ui, sans-serif" font-size="6" font-weight="500" fill="#777777" text-anchor="middle">Zero White Cast</text>
    <rect x="30" y="165" width="34" height="14" rx="7" fill="#FAF0F0"/>
    <text x="47" y="175" font-family="system-ui, sans-serif" font-size="7" font-weight="800" fill="#E85D5D" text-anchor="middle">STEP 3</text>
  </g>

  <!-- Bottom Title Tag -->
  <text x="300" y="560" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#1A1A1A" text-anchor="middle" letter-spacing="2">THE COMPLETE DAILY ESSENTIAL TRIO</text>
  <text x="300" y="580" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#6B6B6B" text-anchor="middle">CLEANSER • MOISTURIZER • SUNSCREEN</text>
</svg>
