<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="studioBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="80%" stop-color="#FAFAFA" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#F3E5AB" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="20" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#studioBg)" />

  <!-- Soft Shadow -->
  <ellipse cx="400" cy="710" rx="150" ry="18" fill="#000000" opacity="0.1" filter="blur(10px)" />

  <!-- Bottle Group -->
  <g filter="url(#shadow2)">
    <path d="M 310 270 C 350 250, 450 250, 490 270 C 525 310, 535 430, 530 600 C 525 660, 480 680, 400 680 C 320 680, 275 660, 270 600 C 265 430, 275 310, 310 270 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    
    <!-- Highlights -->
    <path d="M 315 285 C 340 270, 390 265, 410 265 C 380 275, 310 320, 300 620 C 295 650, 285 620, 285 580 C 280 440, 290 320, 315 285 Z" fill="#F8FAFC" />

    <!-- Pump -->
    <rect x="360" y="235" width="80" height="20" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
    <rect x="370" y="210" width="60" height="28" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    <path d="M 400 210 L 400 160 C 400 145, 370 135, 320 145 C 305 148, 300 158, 305 168 C 310 175, 325 175, 340 170 L 400 175 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  </g>

  <!-- LABEL -->
  <g transform="translate(400, 330)">
    <circle cx="0" cy="0" r="28" fill="none" stroke="url(#gold2)" stroke-width="2" />
    <circle cx="0" cy="0" r="32" fill="none" stroke="url(#gold2)" stroke-width="1" stroke-dasharray="3 2" />
    <text x="0" y="4" text-anchor="middle" font-family="'Playfair Display', serif" font-size="16" font-weight="bold" fill="url(#gold2)">C</text>
    
    <text x="0" y="52" text-anchor="middle" font-family="'Playfair Display', serif" font-size="24" font-weight="bold" letter-spacing="2" fill="url(#gold2)">CARe</text>
    <text x="0" y="66" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" letter-spacing="3" fill="#92400E">A BEAUTY SOLUTION</text>

    <text x="0" y="96" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#0F766E">REFRESHING</text>
    <text x="0" y="116" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#0F766E">SKIN CLEANSER</text>
    <text x="0" y="132" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#475569">For Face &amp; Body</text>

    <text x="0" y="150" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#334155">Soap-Free  |  pH Balanced  |  Barrier-Friendly</text>
    <rect x="-90" y="160" width="180" height="20" rx="4" fill="#CCFBF1" stroke="#0D9488" stroke-width="0.8" />
    <text x="0" y="174" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="800" fill="#0F766E">With Niacinamide &amp; Panthenol</text>

    <text x="0" y="196" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#475569">Fragrance-Free • Non-Comedogenic</text>
    <text x="0" y="214" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#0F766E">Gently Cleanses Without Drying</text>
    <text x="0" y="232" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#0F766E">120 ml</text>
  </g>
</svg>
