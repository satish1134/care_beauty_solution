<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="vanityBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="60%" stop-color="#F3EFEA" />
      <stop offset="100%" stop-color="#E2D9CC" />
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <filter id="vShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="18" flood-color="#1E293B" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#vanityBg)" />

  <!-- Marble Counter Base -->
  <path d="M 0 520 L 800 520 L 800 800 L 0 800 Z" fill="#FFFFFF" opacity="0.6" />
  <line x1="0" y1="520" x2="800" y2="520" stroke="#CBD5E1" stroke-width="2" />

  <!-- Gold Framed Bathroom Mirror Background Right -->
  <circle cx="700" cy="280" r="220" fill="none" stroke="url(#goldRing)" stroke-width="16" filter="url(#vShadow)" />
  <circle cx="700" cy="280" r="212" fill="#F8FAFC" opacity="0.8" />

  <!-- Stacked Plush White Towels Left -->
  <g filter="url(#vShadow)">
    <rect x="60" y="380" width="260" height="70" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    <rect x="80" y="450" width="260" height="70" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
  </g>

  <!-- Product Bottle Centered Angle -->
  <g transform="translate(60, 20)" filter="url(#vShadow)">
    <path d="M 310 270 C 350 250, 450 250, 490 270 C 525 310, 535 430, 530 600 C 525 660, 480 680, 400 680 C 320 680, 275 660, 270 600 C 265 430, 275 310, 310 270 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
    
    <!-- Pump -->
    <rect x="360" y="235" width="80" height="20" rx="4" fill="#F1F5F9" />
    <path d="M 400 210 L 400 160 C 400 145, 370 135, 320 145 C 305 148, 300 158, 305 168 C 310 175, 325 175, 340 170 L 400 175 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />

    <!-- Label Artwork -->
    <g transform="translate(400, 330)">
      <circle cx="0" cy="0" r="28" fill="none" stroke="url(#goldRing)" stroke-width="2" />
      <text x="0" y="4" text-anchor="middle" font-family="'Playfair Display', serif" font-size="16" font-weight="bold" fill="url(#goldRing)">C</text>
      <text x="0" y="52" text-anchor="middle" font-family="'Playfair Display', serif" font-size="24" font-weight="bold" letter-spacing="2" fill="url(#goldRing)">CARe</text>
      <text x="0" y="96" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#0F766E">REFRESHING</text>
      <text x="0" y="116" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#0F766E">SKIN CLEANSER</text>
      <rect x="-90" y="150" width="180" height="20" rx="4" fill="#CCFBF1" stroke="#0D9488" stroke-width="0.8" />
      <text x="0" y="164" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="800" fill="#0F766E">With Niacinamide &amp; Panthenol</text>
    </g>
  </g>
</svg>
