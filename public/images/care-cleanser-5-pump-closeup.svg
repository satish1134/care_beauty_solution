<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPump" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="pumpShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="16" flood-color="#000" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bgPump)" />

  <g transform="translate(100, 100)" filter="url(#pumpShadow)">
    <!-- Macro Bottle Neck -->
    <rect x="200" y="450" width="200" height="200" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="4" />
    
    <!-- Ribbed Lock Ring -->
    <rect x="220" y="380" width="160" height="70" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="3" />
    <line x1="220" y1="415" x2="380" y2="415" stroke="#CBD5E1" stroke-width="4" />

    <!-- Pump Stem -->
    <rect x="250" y="280" width="100" height="100" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3" />

    <!-- Dispenser Head -->
    <path d="M 300 280 L 300 120 C 300 80, 220 50, 80 80 C 50 86, 40 110, 50 130 C 60 145, 90 145, 120 135 L 300 150 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="4" />

    <!-- Top Thumb Ergonomic Curve -->
    <ellipse cx="230" cy="80" rx="60" ry="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2" />
  </g>

  <!-- Specular Reflection Highlight -->
  <path d="M 360 220 L 360 380" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.8" />
  
  <!-- Text Badge -->
  <rect x="220" y="680" width="360" height="50" rx="25" fill="#0F766E" />
  <text x="400" y="712" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" letter-spacing="2">PRECISION DOSING PUMP</text>
</svg>
