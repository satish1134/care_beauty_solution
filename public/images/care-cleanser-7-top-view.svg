<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="topShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#000" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bgTop)" />

  <g transform="translate(400, 400)" filter="url(#topShadow)">
    <!-- Top-down view of oval bottle shoulders -->
    <ellipse cx="0" cy="0" rx="220" ry="140" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3" />
    <ellipse cx="0" cy="0" rx="190" ry="110" fill="#F8FAFC" />

    <!-- Pump collar top ring -->
    <circle cx="0" cy="0" r="50" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2" />
    <circle cx="0" cy="0" r="38" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />

    <!-- Pump head extending outwards -->
    <path d="M 0 -20 Q 140 -20 160 -10 C 170 0, 170 10, 160 20 Q 140 20 0 20 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
    <circle cx="-10" cy="0" r="22" fill="#F1F5F9" />
  </g>

  <rect x="220" y="660" width="360" height="50" rx="25" fill="#0F766E" />
  <text x="400" y="692" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" letter-spacing="2">TOP ANGLE PERSPECTIVE</text>
</svg>
