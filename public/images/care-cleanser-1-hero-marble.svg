<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="50%" stop-color="#F3EFEA" />
      <stop offset="100%" stop-color="#E5DEC9" />
    </linearGradient>

    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#F3E5AB" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>

    <linearGradient id="bottleBody1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="20%" stop-color="#FFFFFF" />
      <stop offset="80%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="16" flood-color="#2D3748" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Background Spa Scene -->
  <rect width="800" height="800" fill="url(#bgGrad1)" />
  
  <!-- Countertop surface -->
  <path d="M 0 560 L 800 560 L 800 800 L 0 800 Z" fill="#E2E8F0" opacity="0.3" />
  <line x1="0" y1="560" x2="800" y2="560" stroke="#CBD5E1" stroke-width="2" />

  <!-- Botanical Green Leaves Left -->
  <path d="M 50 80 C 110 60 170 110 190 180 C 130 200 70 150 50 80 Z" fill="#15803D" opacity="0.85" />
  <path d="M 20 160 C 80 130 140 170 150 250 C 90 280 30 240 20 160 Z" fill="#166534" opacity="0.8" />
  
  <!-- Rolled White Towel Right -->
  <g filter="url(#shadow1)">
    <rect x="560" y="400" width="200" height="150" rx="24" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="2" />
    <line x1="560" y1="450" x2="760" y2="450" stroke="#E2E8F0" stroke-width="3" />
    <line x1="560" y1="500" x2="760" y2="500" stroke="#E2E8F0" stroke-width="3" />
  </g>

  <!-- Bottle Contact Shadow -->
  <ellipse cx="400" cy="690" rx="140" ry="20" fill="#1E293B" opacity="0.2" filter="blur(8px)" />

  <!-- BOTTLE -->
  <g filter="url(#shadow1)">
    <path d="M 310 270 C 350 250, 450 250, 490 270 C 525 310, 535 430, 530 600 C 525 660, 480 680, 400 680 C 320 680, 275 660, 270 600 C 265 430, 275 310, 310 270 Z" fill="url(#bottleBody1)" />
    
    <!-- Pump -->
    <rect x="360" y="235" width="80" height="20" rx="4" fill="#E2E8F0" />
    <rect x="370" y="210" width="60" height="28" rx="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1" />
    <path d="M 400 210 L 400 160 C 400 145, 370 135, 320 145 C 305 148, 300 158, 305 168 C 310 175, 325 175, 340 170 L 400 175 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  </g>

  <!-- LABEL CONTENT -->
  <g transform="translate(400, 330)">
    <!-- Gold Logo -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="url(#goldGrad1)" stroke-width="2" />
    <circle cx="0" cy="0" r="32" fill="none" stroke="url(#goldGrad1)" stroke-width="1" stroke-dasharray="3 2" />
    <text x="0" y="4" text-anchor="middle" font-family="'Playfair Display', serif" font-size="16" font-weight="bold" fill="url(#goldGrad1)">C</text>
    
    <!-- Brand -->
    <text x="0" y="52" text-anchor="middle" font-family="'Playfair Display', serif" font-size="24" font-weight="bold" letter-spacing="2" fill="url(#goldGrad1)">CARe</text>
    <text x="0" y="66" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" letter-spacing="3" fill="#92400E">A BEAUTY SOLUTION</text>

    <!-- Product Name -->
    <text x="0" y="96" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#0F766E">REFRESHING</text>
    <text x="0" y="116" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#0F766E">SKIN CLEANSER</text>
    <text x="0" y="132" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#475569">For Face &amp; Body</text>

    <!-- Claims & Active Pill -->
    <text x="0" y="150" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#334155">Soap-Free  |  pH Balanced  |  Barrier-Friendly</text>
    <rect x="-90" y="160" width="180" height="20" rx="4" fill="#CCFBF1" stroke="#0D9488" stroke-width="0.8" />
    <text x="0" y="174" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="800" fill="#0F766E">With Niacinamide &amp; Panthenol</text>
    
    <text x="0" y="196" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#475569">Fragrance-Free • Non-Comedogenic</text>
    <text x="0" y="214" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#0F766E">Gently Cleanses Without Drying</text>
    <text x="0" y="232" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#0F766E">120 ml</text>
  </g>
</svg>
