<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <!-- Luxury Deep Charcoal / Black Canvas -->
  <rect width="800" height="800" fill="#0A0B0D" rx="28" />
  <radialGradient id="darkBgGlow" cx="50%" cy="36%" r="50%">
    <stop offset="0%" stop-color="#2A2210" stop-opacity="0.6" />
    <stop offset="70%" stop-color="#0A0B0D" stop-opacity="0.9" />
    <stop offset="100%" stop-color="#050607" />
  </radialGradient>
  <rect width="800" height="800" fill="url(#darkBgGlow)" rx="28" />

  
  <defs>
    <linearGradient id="flGold3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E3803" />
      <stop offset="12%" stop-color="#9C7215" />
      <stop offset="26%" stop-color="#DBB030" />
      <stop offset="42%" stop-color="#FFF9DE" />
      <stop offset="56%" stop-color="#ECC664" />
      <stop offset="72%" stop-color="#A57A18" />
      <stop offset="88%" stop-color="#FAE89E" />
      <stop offset="100%" stop-color="#4A2800" />
    </linearGradient>

    <linearGradient id="flGoldWire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#734907" />
      <stop offset="25%" stop-color="#D8AF33" />
      <stop offset="50%" stop-color="#FFF6D0" />
      <stop offset="75%" stop-color="#9E7317" />
      <stop offset="100%" stop-color="#5B3402" />
    </linearGradient>

    <linearGradient id="flGoldSpec" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A1E00" stop-opacity="0.15" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#EAC45F" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.95" />
    </linearGradient>

    <filter id="flBevel" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2.5" dy="5.0" stdDeviation="4.0" flood-color="#221100" flood-opacity="0.38" />
      <feDropShadow dx="-1.2" dy="-1.2" stdDeviation="1.8" flood-color="#FFFDF0" flood-opacity="0.9" />
    </filter>
  </defs>

  <g id="full-master-logo" filter="url(#flBevel)">
    <!-- TOP EMBLEM (Center X=400, Y=290, Radius ~180) -->
    <g transform="translate(400, 290)">
      <!-- Guilloche Wreath -->
      <g transform="scale(1.08) translate(-400, -310)">
        <ellipse cx="400" cy="310" rx="175" ry="58" transform="rotate(0.00 400 310)" fill="none" stroke="url(#flGoldWire)" stroke-width="4.8" />
        <ellipse cx="400" cy="310" rx="175" ry="58" transform="rotate(18.00 400 310)" fill="none" stroke="url(#flGoldWire)" stroke-width="4.8" />
        <ellipse cx="400" cy="310" rx="175" ry="58" transform="rotate(36.00 400 310)" fill="none" stroke="url(#flGoldWire)" stroke-width="4.8" />
        <ellipse cx="400" cy="310" rx="175" ry="58" transform="rotate(54.00 400 310)" fill="none" stroke="url(#flGoldWire)" stroke-width="4.8" />
        <ellipse cx="400" cy="310" rx="175" ry="58" transform="rotate(72.00 400 310)" fill="none" stroke="url(#flGoldWire)" stroke-width="4.8" />
        <ellipse cx="400" cy="310" rx="175" ry="58" transform="rotate(90.00 400 310)" fill="none" stroke="url(#flGoldWire)" stroke-width="4.8" />
        <ellipse cx="400" cy="310" rx="175" ry="58" transform="rotate(108.00 400 310)" fill="none" stroke="url(#flGoldWire)" stroke-width="4.8" />
        <ellipse cx="400" cy="310" rx="175" ry="58" transform="rotate(126.00 400 310)" fill="none" stroke="url(#flGoldWire)" stroke-width="4.8" />
        <ellipse cx="400" cy="310" rx="175" ry="58" transform="rotate(144.00 400 310)" fill="none" stroke="url(#flGoldWire)" stroke-width="4.8" />
        <ellipse cx="400" cy="310" rx="175" ry="58" transform="rotate(162.00 400 310)" fill="none" stroke="url(#flGoldWire)" stroke-width="4.8" />
        <ellipse cx="400" cy="310" rx="175" ry="58" transform="rotate(180.00 400 310)" fill="none" stroke="url(#flGoldWire)" stroke-width="4.8" />
        <ellipse cx="400" cy="310" rx="175" ry="58" transform="rotate(198.00 400 310)" fill="none" stroke="url(#flGoldWire)" stroke-width="4.8" />
        <ellipse cx="400" cy="310" rx="175" ry="58" transform="rotate(216.00 400 310)" fill="none" stroke="url(#flGoldWire)" stroke-width="4.8" />
        <ellipse cx="400" cy="310" rx="175" ry="58" transform="rotate(234.00 400 310)" fill="none" stroke="url(#flGoldWire)" stroke-width="4.8" />
        <ellipse cx="400" cy="310" rx="175" ry="58" transform="rotate(252.00 400 310)" fill="none" stroke="url(#flGoldWire)" stroke-width="4.8" />
        <ellipse cx="400" cy="310" rx="175" ry="58" transform="rotate(270.00 400 310)" fill="none" stroke="url(#flGoldWire)" stroke-width="4.8" />
        <ellipse cx="400" cy="310" rx="175" ry="58" transform="rotate(288.00 400 310)" fill="none" stroke="url(#flGoldWire)" stroke-width="4.8" />
        <ellipse cx="400" cy="310" rx="175" ry="58" transform="rotate(306.00 400 310)" fill="none" stroke="url(#flGoldWire)" stroke-width="4.8" />
        <ellipse cx="400" cy="310" rx="175" ry="58" transform="rotate(324.00 400 310)" fill="none" stroke="url(#flGoldWire)" stroke-width="4.8" />
        <ellipse cx="400" cy="310" rx="175" ry="58" transform="rotate(342.00 400 310)" fill="none" stroke="url(#flGoldWire)" stroke-width="4.8" />
        <ellipse cx="399" cy="309" rx="175" ry="58" transform="rotate(0.00 400 310)" fill="none" stroke="url(#flGoldSpec)" stroke-width="1.6" opacity="0.9" />
        <ellipse cx="399" cy="309" rx="175" ry="58" transform="rotate(36.00 400 310)" fill="none" stroke="url(#flGoldSpec)" stroke-width="1.6" opacity="0.9" />
        <ellipse cx="399" cy="309" rx="175" ry="58" transform="rotate(72.00 400 310)" fill="none" stroke="url(#flGoldSpec)" stroke-width="1.6" opacity="0.9" />
        <ellipse cx="399" cy="309" rx="175" ry="58" transform="rotate(108.00 400 310)" fill="none" stroke="url(#flGoldSpec)" stroke-width="1.6" opacity="0.9" />
        <ellipse cx="399" cy="309" rx="175" ry="58" transform="rotate(144.00 400 310)" fill="none" stroke="url(#flGoldSpec)" stroke-width="1.6" opacity="0.9" />
        <ellipse cx="399" cy="309" rx="175" ry="58" transform="rotate(180.00 400 310)" fill="none" stroke="url(#flGoldSpec)" stroke-width="1.6" opacity="0.9" />
        <ellipse cx="399" cy="309" rx="175" ry="58" transform="rotate(216.00 400 310)" fill="none" stroke="url(#flGoldSpec)" stroke-width="1.6" opacity="0.9" />
        <ellipse cx="399" cy="309" rx="175" ry="58" transform="rotate(252.00 400 310)" fill="none" stroke="url(#flGoldSpec)" stroke-width="1.6" opacity="0.9" />
        <ellipse cx="399" cy="309" rx="175" ry="58" transform="rotate(288.00 400 310)" fill="none" stroke="url(#flGoldSpec)" stroke-width="1.6" opacity="0.9" />
        <ellipse cx="399" cy="309" rx="175" ry="58" transform="rotate(324.00 400 310)" fill="none" stroke="url(#flGoldSpec)" stroke-width="1.6" opacity="0.9" />
      </g>

      <!-- Inner Circles -->
      <circle cx="0" cy="0" r="114" fill="none" stroke="url(#flGold3D)" stroke-width="7.5" />
      <circle cx="0" cy="0" r="114" fill="none" stroke="url(#flGoldSpec)" stroke-width="2.5" />
      <circle cx="0" cy="0" r="106" fill="none" stroke="url(#flGold3D)" stroke-width="3.5" />

      <!-- Center Vertical Divider Bar -->
      <rect x="-3.5" y="-76" width="7.0" height="152" rx="3.5" fill="url(#flGold3D)" stroke="url(#flGoldSpec)" stroke-width="1.2" />
      <line x1="-1.0" y1="-74" x2="-1.0" y2="74" stroke="#FFFFFF" stroke-width="1.5" opacity="0.9" />

      <!-- Left Botanical Leaf Cluster -->
      <g transform="translate(-54, 0) scale(1.75)">
        <path d="M 0 -42 C -15 -24, -15 -5, 0 8 C 15 -5, 15 -24, 0 -42 Z" fill="url(#flGold3D)" stroke="url(#flGoldSpec)" stroke-width="2.5" />
        <path d="M -5 -11 C -30 -28, -40 -8, -7 4 C -3 3, -1 -2, -5 -11 Z" fill="url(#flGold3D)" stroke="url(#flGoldSpec)" stroke-width="2" />
        <path d="M 5 -11 C 30 -28, 40 -8, 7 4 C 3 3, 1 -2, 5 -11 Z" fill="url(#flGold3D)" stroke="url(#flGoldSpec)" stroke-width="2" />
        <path d="M -5 6 C -24 5, -29 18, -6 14 Z" fill="url(#flGold3D)" stroke="url(#flGoldSpec)" stroke-width="1.8" />
        <path d="M 5 6 C 24 5, 29 18, 6 14 Z" fill="url(#flGold3D)" stroke="url(#flGoldSpec)" stroke-width="1.8" />
        <path d="M 0 8 L 0 32" stroke="url(#flGold3D)" stroke-width="4.5" stroke-linecap="round" />
      </g>

      <!-- Right Roman Letter 'C' -->
      <g transform="translate(54, 0) scale(1.75)">
        <path d="M 32 -32 C 26 -40, 18 -44, 6 -44 C -17 -44 -32 -26 -32 0 C -32 26 -17 44 6 44 C 19 44 28 38 32 31 L 25 26 C 21 32 15 36 7 36 C -10 36 -21 22 -21 0 C -21 -22 -10 -36 7 -36 C 15 -36 21 -32 24 -27 Z" 
              fill="url(#flGold3D)" stroke="url(#flGoldSpec)" stroke-width="1.8" />
        <circle cx="31" cy="-30" r="5.5" fill="url(#flGold3D)" stroke="url(#flGoldSpec)" stroke-width="1" />
        <path d="M 23 26 L 36 33 L 24 38 Z" fill="url(#flGold3D)" />
      </g>
    </g>

    <!-- CARe BRAND WORDMARK -->
    <g transform="translate(400, 585)" text-anchor="middle">
      <text font-family="'Cinzel', 'Playfair Display', 'Times New Roman', Georgia, serif" 
            font-size="132" 
            font-weight="700" 
            letter-spacing="14" 
            fill="url(#flGold3D)" 
            stroke="url(#flGoldSpec)" 
            stroke-width="1.8">
        <tspan>C</tspan>
        <tspan dx="8">A</tspan>
        <tspan dx="8">R</tspan>
        <tspan dx="8" font-size="116" dy="-2">e</tspan>
      </text>
    </g>

    <!-- KNOT DIVIDER BAR -->
    <g transform="translate(400, 626)">
      <!-- Left & Right Gold Rule Lines -->
      <line x1="-310" y1="0" x2="-42" y2="0" stroke="url(#flGold3D)" stroke-width="2.6" stroke-linecap="round" />
      <line x1="-310" y1="-0.8" x2="-42" y2="-0.8" stroke="url(#flGoldSpec)" stroke-width="0.8" />

      <line x1="42" y1="0" x2="310" y2="0" stroke="url(#flGold3D)" stroke-width="2.6" stroke-linecap="round" />
      <line x1="42" y1="-0.8" x2="310" y2="-0.8" stroke="url(#flGoldSpec)" stroke-width="0.8" />

      <!-- Center Fleur / Knot Emblem -->
      <g transform="scale(0.85)">
        <path d="M 0 -10 C -8 -6, -8 6, 0 10 C 8 6, 8 -6, 0 -10 Z" fill="url(#flGold3D)" stroke="url(#flGoldSpec)" stroke-width="1.2" />
        <circle cx="-16" cy="0" r="5.5" fill="url(#flGold3D)" stroke="url(#flGoldSpec)" stroke-width="1.0" />
        <circle cx="16" cy="0" r="5.5" fill="url(#flGold3D)" stroke="url(#flGoldSpec)" stroke-width="1.0" />
        <circle cx="-28" cy="0" r="3.2" fill="url(#flGold3D)" />
        <circle cx="28" cy="0" r="3.2" fill="url(#flGold3D)" />
        <circle cx="0" cy="0" r="4.0" fill="#FFF8D8" />
      </g>
    </g>

    <!-- SUBTITLE: A BEAUTY SOLUTION -->
    <g transform="translate(400, 680)" text-anchor="middle">
      <text font-family="'Cinzel', 'Playfair Display', 'Times New Roman', Georgia, serif" 
            font-size="28" 
            font-weight="700" 
            letter-spacing="18" 
            fill="url(#flGold3D)" 
            stroke="url(#flGoldSpec)" 
            stroke-width="0.8">
        A BEAUTY SOLUTION
      </text>
    </g>
  </g>

</svg>